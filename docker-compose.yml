version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: copilot_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: trading_platform
      POSTGRES_USER: copilot_user
      POSTGRES_PASSWORD: copilot_pass_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot_user -d trading_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    driver: local
